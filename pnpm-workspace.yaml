packages:
  - "packages/*"

allowBuilds:
  core-js: false
  core-js-pure: false
  esbuild: true

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
  vitest: 5.0.5

# vite-plus provides `vite` through its own core; point every `vite` at it.
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
